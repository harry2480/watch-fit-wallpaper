name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: 検証
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 描画テスト（実ブラウザでのピクセル比較）
        run: pnpm test:browser
      - name: E2E（GitHub Pages と同じサブパスで配信）
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "CI検証結果: verify=$VERIFY_RESULT e2e=$E2E_RESULT"
            exit 1
          fi
          echo "CI検証に成功しました"
